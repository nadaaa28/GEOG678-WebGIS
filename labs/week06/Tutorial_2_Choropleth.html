<<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Interactive Choropleth Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1,
    p {
      text-align: center;
    }

    /* Make the map larger and center it */
    #map {
      height: 75vh;
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Information box */
    .info {
      padding: 8px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 0 15px #777;
      border-radius: 5px;
      line-height: 20px;
    }

    .info h4 {
      margin: 0 0 5px;
    }

    /* Legend */
    .legend i {
      width: 18px;
      height: 18px;
      float: left;
      margin-right: 8px;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <h1>Interactive Choropleth Map</h1>


  <!-- Map container -->
  <div id="map"></div>

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- US states GeoJSON data -->
  <script src="https://leafletjs.com/examples/choropleth/us-states.js"></script>

  <script>
    // Create the map
    const map = L.map('map').setView([37.8, -96], 4);

    // Add the OpenStreetMap basemap
    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">' +
          'OpenStreetMap</a> contributors'
      }
    ).addTo(map);

    // Select a color based on population density
    function getColor(d) {
      return d > 1000 ? '#800026' :
             d > 500  ? '#BD0026' :
             d > 200  ? '#E31A1C' :
             d > 100  ? '#FC4E2A' :
             d > 50   ? '#FD8D3C' :
             d > 20   ? '#FEB24C' :
             d > 10   ? '#FED976' :
                        '#FFEDA0';
    }

    // Style each state
    function style(feature) {
      return {
        fillColor: getColor(feature.properties.density),
        weight: 2,
        opacity: 1,
        color: 'white',
        dashArray: '3',
        fillOpacity: 0.7
      };
    }

    // Create an information box
    const info = L.control();

    info.onAdd = function () {
      this.box = L.DomUtil.create('div', 'info');
      this.update();

      return this.box;
    };

    info.update = function (properties) {
      this.box.innerHTML =
        '<h4>US Population Density</h4>' +
        (
          properties
            ? '<b>' + properties.name + '</b><br>' +
              properties.density + ' people / mi²'
            : 'Hover over a state'
        );
    };

    info.addTo(map);

    // Define the GeoJSON layer before using it in functions
    let geojson;

    // Highlight a state when the mouse is over it
    function highlightFeature(event) {
      const layer = event.target;

      layer.setStyle({
        weight: 5,
        color: '#666',
        dashArray: '',
        fillOpacity: 0.7
      });

      layer.bringToFront();
      info.update(layer.feature.properties);
    }

    // Return the state to its original style
    function resetHighlight(event) {
      geojson.resetStyle(event.target);
      info.update();
    }

    // Zoom to a state when it is clicked
    function zoomToFeature(event) {
      map.fitBounds(event.target.getBounds());
    }

    // Add interactions to each state
    function onEachFeature(feature, layer) {
      layer.on({
        mouseover: highlightFeature,
        mouseout: resetHighlight,
        click: zoomToFeature
      });
    }

    // Add the state data to the map
    if (typeof statesData !== 'undefined') {
      geojson = L.geoJSON(statesData, {
        style: style,
        onEachFeature: onEachFeature
      }).addTo(map);
    } else {
      document.getElementById('map').insertAdjacentHTML(
        'beforebegin',
        '<p>State data could not load. Check your internet connection.</p>'
      );
    }

    // Create the legend
    const legend = L.control({
      position: 'bottomright'
    });

    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'info legend');

      const grades = [0, 10, 20, 50, 100, 200, 500, 1000];

      div.innerHTML = '<b>People / mi²</b><br>';

      for (let i = 0; i < grades.length; i++) {
        div.innerHTML +=
          '<i style="background:' + getColor(grades[i] + 1) + '"></i>' +
          grades[i] +
          (grades[i + 1] ? '–' + grades[i + 1] : '+') +
          '<br>';
      }

      return div;
    };

    legend.addTo(map);
  </script>
</body>
</html>
