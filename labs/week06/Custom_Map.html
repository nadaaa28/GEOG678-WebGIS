<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>TAMU Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    /* Center and enlarge the title */
    h1 {
      text-align: center;
      font-size: 48px;
    }

    /* Center and enlarge the map */
    #mapid {
      height: 75vh;
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Building information box */
    .info {
      padding: 10px;
      background: white;
      border-radius: 5px;
      box-shadow: 0 0 12px #888;
    }

    .info h4 {
      margin: 0 0 6px;
    }
  </style>
</head>

<body>

  <h1>TAMU Map</h1>

  <!-- Map container -->
  <div id="mapid"></div>

  <!-- TAMU building data -->
  <script src="tamubuildings.js"></script>

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Create the map and center it on TAMU
    const map = L.map('mapid').setView([30.6188, -96.3365], 15);

    // Add the OpenStreetMap basemap
    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,

        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">' +
          'OpenStreetMap</a> contributors'
      }
    ).addTo(map);

    // Create the building information control
    const info = L.control();

    info.onAdd = function () {
      this.box = L.DomUtil.create('div', 'info');
      this.update();

      return this.box;
    };

    info.update = function (properties) {
      this.box.replaceChildren();

      const heading = document.createElement('h4');
      heading.textContent = 'TAMU Building Info';
      this.box.appendChild(heading);

      const details = document.createElement('div');

      if (properties) {
        const buildingName =
          properties.BldgName || 'Name unavailable';

        const buildingAbbreviation =
          (properties.BldgAbbr || '').trim() || 'Not available';

        details.textContent =
          buildingName + ' — Abbreviation: ' + buildingAbbreviation;
      } else {
        details.textContent = 'Hover over a building';
      }

      this.box.appendChild(details);
    };

    info.addTo(map);

    // Set the building color to maroon
    function style() {
      return {
        weight: 2,
        color: '#800000',
        fillColor: '#800000',
        fillOpacity: 0.7
      };
    }

    // Highlight the building when the mouse is over it
    function highlightFeature(event) {
      const layer = event.target;

      layer.setStyle({
        weight: 4,
        color: '#ffb900',
        fillOpacity: 0.9
      });

      layer.bringToFront();
      info.update(layer.feature.properties);
    }

    // Return the building to its original style
    function resetHighlight(event) {
      buildingsLayer.resetStyle(event.target);
      info.update();
    }

    // Zoom to the building when it is clicked
    function zoomToFeature(event) {
      map.fitBounds(event.target.getBounds(), {
        maxZoom: 19
      });
    }

    // Add interactions to each building
    function onEachFeature(feature, layer) {
      layer.on({
        mouseover: highlightFeature,
        mouseout: resetHighlight,
        click: zoomToFeature
      });
    }

    // Add the TAMU building GeoJSON data
    const buildingsLayer = L.geoJSON(tamu, {
      style: style,
      onEachFeature: onEachFeature
    }).addTo(map);
  </script>

</body>
</html>
